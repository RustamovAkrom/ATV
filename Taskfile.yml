version: "3"

vars:
  RUNNER:
    sh: 'echo {{ .RUNNER | default "uv run --no-sync" }}'
  SOURCES: src tests

# ═══════════════════════════════════════════
# DEFAULT
# ═══════════════════════════════════════════
tasks:
  default:
    cmd: task --list

# ═══════════════════════════════════════════
# DATABASE
# ═══════════════════════════════════════════

  db-up:
    desc: Start PostgreSQL
    cmd: docker compose up -d --wait postgres

  db-down:
    desc: Stop PostgreSQL
    cmd: docker compose down

  db-shell:
    desc: Open PostgreSQL shell
    cmd: docker compose exec postgres sh -c 'psql -U $POSTGRES_USER $POSTGRES_DB'

  db-revision:
    desc: Create migration (NAME=<message>)
    cmds:
      - task: db-up
      - "{{.RUNNER}} alembic -c src/alembic.ini revision --autogenerate -m '{{.NAME | default .MSG}}'"

  db-migrate:
    desc: Apply all migrations
    cmds:
      - task: db-up
      - "{{.RUNNER}} alembic -c src/alembic.ini upgrade head"

  db-downgrade:
    desc: Roll back latest migration
    cmds:
      - task: db-up
      - "{{.RUNNER}} alembic -c src/alembic.ini downgrade -1"

  db-seed:
    desc: Seed roles & permissions
    env:
      PYTHONPATH: src
    cmd: "{{.RUNNER}} python -m scripts.cli bootstrap"

# ═══════════════════════════════════════════
# REDIS
# ═══════════════════════════════════════════

  redis-up:
    desc: Start Redis
    cmd: docker compose up -d --wait redis

  redis-cli:
    desc: Connect to Redis CLI
    cmd: docker compose exec redis redis-cli

# ═══════════════════════════════════════════
# DEV
# ═══════════════════════════════════════════

  init:
    desc: Initialize project (sync deps, migrate, seed)
    cmds:
      - uv sync
      - task: db-up
      - task: db-migrate
      - task: db-seed

  bootstrap:
    desc: Seed roles & permissions (local)
    env:
      PYTHONPATH: src
    cmd: "{{.RUNNER}} python -m scripts.cli bootstrap"

  create-superadmin:
    desc: Create superadmin user
    env:
      PYTHONPATH: src
    cmd: "{{.RUNNER}} python -m scripts.cli create-superadmin"

  run:
    desc: Run backend in dev mode (with init)
    env:
      PYTHONPATH: src
      ENV: local
    cmds:
      - task: init
      - "{{.RUNNER}} fastapi dev src/dev.py"

  run-fast:
    desc: Run backend without init (faster)
    env:
      PYTHONPATH: src
      ENV: local
    cmd: "{{.RUNNER}} fastapi dev src/dev.py"

  cleanup-tokens:
    desc: Delete expired refresh tokens
    env:
      PYTHONPATH: src
    cmd: "{{.RUNNER}} python -c 'from scripts.cleanup.tokens import run; run()'"

# ═══════════════════════════════════════════
# PRODUCTION
# ═══════════════════════════════════════════

  prod:
    desc: Run production stack
    cmd: docker compose --profile prod up -d

  prod-build:
    desc: Build and run production stack
    cmd: docker compose --profile prod up -d --build

# ═══════════════════════════════════════════
# NGINX
# ═══════════════════════════════════════════

  nginx-up:
    desc: Start nginx reverse proxy
    cmd: docker compose --profile nginx up -d

  nginx-down:
    desc: Stop nginx
    cmd: docker compose --profile nginx down

  nginx-reload:
    desc: Reload nginx config (no restart)
    cmd: docker exec iibatv-nginx nginx -s reload

  nginx-test:
    desc: Test nginx configuration syntax
    cmd: docker exec iibatv-nginx nginx -t

  nginx-logs:
    desc: Tail nginx logs
    cmd: docker logs -f iibatv-nginx

# ═══════════════════════════════════════════
# DOCKER
# ═══════════════════════════════════════════

  ps:
    desc: Show running containers
    cmd: docker compose --profile prod --profile nginx ps

  ps-all:
    desc: Show all containers (including stopped)
    cmd: docker compose --profile prod --profile nginx ps -a

  build:
    desc: Build all Docker images
    cmd: docker compose --profile prod --profile nginx build

  restart:
    desc: Restart all services
    cmd: docker compose --profile prod --profile nginx restart

  restart-web:
    desc: Restart web service only
    cmd: docker compose restart web

  down:
    desc: Stop all services
    cmd: docker compose --profile prod --profile nginx down

  down-v:
    desc: Stop all services and remove volumes (DANGER)
    cmd: docker compose --profile prod --profile nginx down -v

# ═══════════════════════════════════════════
# LOGS
# ═══════════════════════════════════════════

  logs:
    desc: Tail all services logs
    cmd: docker compose logs -f

  logs-web:
    desc: Tail web (FastAPI) logs
    cmd: docker compose logs -f web

  logs-celery:
    desc: Tail celery worker logs
    cmd: docker compose logs -f celery_worker

  logs-beat:
    desc: Tail celery beat logs
    cmd: docker compose logs -f celery_beat

  logs-flower:
    desc: Tail flower logs
    cmd: docker compose logs -f celery_flower

  logs-db:
    desc: Tail PostgreSQL logs
    cmd: docker compose logs -f postgres

  logs-redis:
    desc: Tail Redis logs
    cmd: docker compose logs -f redis

# ═══════════════════════════════════════════
# SHELL
# ═══════════════════════════════════════════

  shell:
    desc: Shell into web container
    cmd: docker compose exec web sh

  shell-db:
    desc: Shell into PostgreSQL container
    cmd: docker compose exec postgres sh

  shell-redis:
    desc: Shell into Redis container
    cmd: docker compose exec redis sh

# ═══════════════════════════════════════════
# CODE QUALITY
# ═══════════════════════════════════════════

  format:
    desc: Format code (ruff)
    cmd: "{{.RUNNER}} ruff format {{.SOURCES}}"

  lint:
    desc: Lint code (ruff check)
    cmd: "{{.RUNNER}} ruff check {{.SOURCES}}"

  lint-fix:
    desc: Auto-fix lint issues
    cmd: "{{.RUNNER}} ruff check --fix {{.SOURCES}}"

  fix-imports:
    desc: Fix import sorting
    cmd: "{{.RUNNER}} ruff check --select I {{.SOURCES}}"

  typecheck:
    desc: Run type checker (pyright)
    cmd: "{{.RUNNER}} pyright {{.SOURCES}}"

  security:
    desc: Security scan (bandit)
    cmd: "{{.RUNNER}} bandit -r {{.SOURCES}} -q"

  pre-commit:
    desc: Run pre-commit hooks
    cmd: uvx pre-commit run

# ═══════════════════════════════════════════
# TESTS
# ═══════════════════════════════════════════

  test:
    desc: Run unit tests
    env:
      ENV: test
    cmds:
      - docker compose down -v postgres-test || true
      - docker compose up -d --wait postgres-test
      - "{{.RUNNER}} python -m pytest -vv"

  test-cov:
    desc: Run tests with coverage (min 80%)
    env:
      ENV: test
    cmds:
      - docker compose down -v postgres-test || true
      - docker compose up -d --wait postgres-test
      - "{{.RUNNER}} python -m coverage run -m pytest -vv"
      - "{{.RUNNER}} python -m coverage report -m --fail-under=80"

# ═══════════════════════════════════════════
# DEPENDENCIES
# ═══════════════════════════════════════════

  deps-sync:
    desc: Sync dependencies (uv sync)
    cmd: uv sync

  deps-update:
    desc: Update dependencies lock file
    cmd: uv lock --upgrade
