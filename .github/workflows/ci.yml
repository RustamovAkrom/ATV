name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - "release/**"
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENV: test
      SECRET_KEY: test-secret-key-with-sufficient-length-12345
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
      POSTGRES_ECHO: "false"
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: test
      SMTP_PASSWORD: test
      SMTP_FROM: test@example.com
      RATE_LIMIT_ENABLED: "false"
      LOG_LEVEL: WARNING
      LOG_INCLUDE_REQUEST_ID: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check src

      - name: Ruff format check
        run: uv run --no-sync ruff format --check src

      - name: Pyright typecheck
        run: uv run --no-sync pyright src

      - name: Bandit security scan
        run: uv run --no-sync bandit -r src -c pyproject.toml -q

      - name: Run tests
        run: uv run --no-sync pytest -q
