name: Python Tests

on:
  push:
    branches:
      - dev
      - main
      - master
      - "release/**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  test:
    name: Run task test
    runs-on: ubuntu-latest
    env:
      ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: pip

      - name: Install Taskfile runner
        uses: go-task/task-action@v5
        with:
          task-version: latest

      - name: Install Python dependency manager
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install uv

      - name: Sync Python dependencies with uv
        run: uv sync --dev

      - name: Run Taskfile test task
        run: task test
