<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IIB ATV | Audit Streamer</title>

    <!-- Полифилл для работы SSE с заголовками Authorization -->
    <script src="https://cdn.jsdelivr.net/npm/event-source-polyfill@1.0.31/src/eventsource.min.js"></script>

    <style>
        :root {
            --bg: #0b0f1a;
            --panel: #161b2a;
            --border: #2d334a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;

            --success: #10b981;
            --warning: #f59e0b;
            --critical: #ef4444;
            --info: #3b82f6;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 64px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; letter-spacing: -0.5px; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* --- CONTROLS --- */
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        input, select {
            background: #1e293b;
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn:hover { background: #334155; }
        .btn-primary { background: var(--accent); color: #000; border: none; }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-danger { color: var(--critical); border-color: rgba(239, 68, 68, 0.3); }

        /* --- DASHBOARD LAYOUT --- */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-card {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stats-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        .stats-value { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        /* --- LOG VIEW --- */
        #logs-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #080b14;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-entry {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            cursor: pointer;
            animation: slideIn 0.3s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .log-entry:hover { border-color: var(--accent); background: #1c2235; }

        .log-entry::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--info);
        }

        .log-entry.warning::before { background: var(--warning); }
        .log-entry.critical::before { background: var(--critical); }

        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

        .method-tag {
            font-weight: 800;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        .status-tag { font-weight: 700; }
        .status-success { color: var(--success); }
        .status-error { color: var(--critical); }

        .path-text { font-family: 'JetBrains Mono', monospace; color: var(--accent); flex: 1; margin: 0 15px; overflow: hidden; text-overflow: ellipsis; }

        .log-meta { display: flex; gap: 20px; font-size: 11px; color: var(--text-dim); }

        .json-preview {
            margin-top: 12px;
            padding: 12px;
            background: #000;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a5d6ff;
            white-space: pre-wrap;
            display: none;
            border: 1px solid var(--border);
        }

        .log-entry.open .json-preview { display: block; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            IIB ATV <span style="color: var(--accent)">AUDIT</span>
        </div>

        <div class="toolbar">
            <input id="token" type="password" placeholder="JWT Access Token..." style="width: 250px;" />
            <div class="status-badge">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <button class="btn btn-primary" onclick="reconnect()">Connect</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="stats-card">
                <div class="stats-label">TOTAL REQUESTS</div>
                <div id="stat-total" class="stats-value">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-label">FAILED (4xx/5xx)</div>
                <div id="stat-errors" class="stats-value" style="color: var(--critical)">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-label">REAL-TIME RPS</div>
                <div id="stat-rps" class="stats-value" style="color: var(--accent)">0</div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); width: 100%;">

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label class="stats-label">FILTER LEVEL</label>
                <select id="f-level" onchange="reconnect()">
                    <option value="">All Severities</option>
                    <option value="info">Info</option>
                    <option value="warning">Warning</option>
                    <option value="critical">Critical</option>
                </select>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label class="stats-label">USER ID</label>
                <input id="f-user" placeholder="Filter by UUID..." onchange="reconnect()">
            </div>

            <div style="margin-top: auto; display: flex; gap: 8px;">
                <button class="btn" style="flex: 1;" onclick="togglePause()" id="pause-btn">Pause</button>
                <button class="btn btn-danger" onclick="clearLogs()">Clear</button>
            </div>
        </aside>

        <main id="logs-viewport">
            <!-- Logs will appear here -->
            <div style="text-align: center; color: var(--text-dim); margin-top: 100px;">
                <p>Waiting for connection...</p>
                <small>Enter your JWT token and click Connect</small>
            </div>
        </main>
    </div>

    <script>
        let es = null;
        let isPaused = false;
        let counters = { total: 0, errors: 0, rps: 0 };
        const viewport = document.getElementById('logs-viewport');

        // RPS Counter logic
        setInterval(() => {
            document.getElementById('stat-rps').innerText = counters.rps;
            counters.rps = 0;
        }, 1000);

        function reconnect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert("Please enter a JWT token first!");
                return;
            }

            if (es) es.close();

            // Status UI
            const dot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            const level = document.getElementById('f-level').value;
            const user = document.getElementById('f-user').value;

            let url = new URL("http://localhost:8000/audit/stream/");
            if (level) url.searchParams.append("level", level);
            if (user) url.searchParams.append("user_id", user);

            try {
                es = new EventSourcePolyfill(url.toString(), {
                    headers: { 'Authorization': 'Bearer ' + token },
                    heartbeatTimeout: 60000
                });

                es.onopen = () => {
                    dot.className = 'dot online';
                    statusText.innerText = 'Streaming Live';
                    if (counters.total === 0) viewport.innerHTML = '';
                };

                es.onerror = (e) => {
                    dot.className = 'dot';
                    statusText.innerText = 'Connection Error';
                    console.error("SSE Error:", e);
                };

                es.onmessage = (event) => {
                    if (isPaused) return;
                    if (event.data.startsWith(':')) return; // keep-alive

                    try {
                        const data = JSON.parse(event.data);
                        pushLog(data);
                    } catch (err) {
                        console.error("JSON Parse error", err);
                    }
                };
            } catch (err) {
                alert("Critical error: " + err.message);
            }
        }

        function pushLog(log) {
            counters.total++;
            counters.rps++;
            if (log.status_code >= 400) counters.errors++;

            document.getElementById('stat-total').innerText = counters.total;
            document.getElementById('stat-errors').innerText = counters.errors;

            const isAtBottom = viewport.scrollHeight - viewport.scrollTop <= viewport.clientHeight + 100;

            const div = document.createElement('div');
            div.className = `log-entry ${log.level || 'info'}`;

            const statusClass = log.status_code >= 400 ? 'status-error' : 'status-success';
            const time = new Date().toLocaleTimeString();

            div.innerHTML = `
                <div class="log-header">
                    <span class="method-tag">${log.method}</span>
                    <span class="path-text">${log.path}</span>
                    <span class="status-tag ${statusClass}">${log.status_code}</span>
                </div>
                <div class="log-meta">
                    <span>🕒 ${time}</span>
                    <span>🌐 ${log.ip}</span>
                    <span>⚡ ${log.latency_ms}ms</span>
                    <span>👤 ${log.user_id || 'anonymous'}</span>
                </div>
                <div class="json-preview">${JSON.stringify(log, null, 2)}</div>
            `;

            div.onclick = () => div.classList.toggle('open');
            viewport.appendChild(div);

            if (viewport.children.length > 300) viewport.removeChild(viewport.firstChild);
            if (isAtBottom) viewport.scrollTop = viewport.scrollHeight;
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pause-btn');
            btn.innerText = isPaused ? 'Resume' : 'Pause';
            btn.style.color = isPaused ? 'var(--accent)' : 'white';
        }

        function clearLogs() {
            viewport.innerHTML = '';
            counters = { total: 0, errors: 0, rps: 0 };
            document.getElementById('stat-total').innerText = 0;
            document.getElementById('stat-errors').innerText = 0;
        }
    </script>
</body>
</html>
