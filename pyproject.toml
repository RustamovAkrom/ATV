[project]
name = "fastapibackend"
version = "0.1.0"
description = "Production-ready FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "anyio>=4.13.0",
    "asgiref>=3.11.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "coverage>=7.13.5",
    "cryptography>=46.0.7",
    "fastapi[all]>=0.135.3",
    "flower>=2.0.1",
    "gunicorn>=26.0.0",
    "loguru>=0.7.3",
    "orjson>=3.11.8",
    "pillow>=12.2.0",
    "prometheus-client>=0.24.1",
    "psycopg[binary]>=3.3.3",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-extra-types>=2.11.2",
    "pydantic-settings>=2.13.1",
    "pyjwt[crypto]>=2.12.1",
    "pytest>=9.0.3",
    "python-dateutil>=2.9.0.post0",
    "python-jose>=3.5.0",
    "redis>=7.4.0",
    "ruff>=0.15.10",
    "slowapi>=0.1.9",
    "sqladmin[full]>=0.24.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "yarl>=1.23.0",
]

# -------------------------
# DEV DEPENDENCIES
# -------------------------
[project.optional-dependencies]
dev = [
"bandit>=1.9.4",
    "mypy>=1.20.1",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pyright>=1.1.409",
    "ruff>=0.15.10",
    "deptry>=0.25.1",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.20.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "deptry>=0.25.1",
]

# -------------------------
# PYTEST
# -------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --disable-warnings --tb=short"
testpaths = ["tests"]
markers = [
    "anyio: marks tests that use anyio",
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# -------------------------
# RUFF (LINT + IMPORTS)
# -------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # Ruff-specific rules
]
ignore = [
    "B008",            # FastAPI Depends
    "UP046",           # Pydantic generics
    "SIM117",          # nested with statements
    "RUF012",          # mutable class attributes
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src", "api", "core", "db", "repositories", "schemas", "services", "utils"]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",            # assert used in tests
    "PLR2004",         # magic numbers in tests
    "ARG001",          # unused arguments in test functions
    "D",               # no docstrings required in tests
    "SIM300",          # age comparison ok in tests
]
"alembic/versions/*.py" = [
    "E501",            # long lines in migrations
    "F841",            # unused variables in migrations
    "ANN",             # no annotations in migrations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

# -------------------------
# MYPY
# -------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "^tests/",
    "^alembic/versions/",
    "^scripts/",
    "^src/dev.py$",
    "^src/main.py$",
]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

# -------------------------
# BANDIT
# -------------------------
[tool.bandit]
skips = ["B101"]  # assert usage (ok in tests)
exclude_dirs = ["tests"]

# -------------------------
# COVERAGE (pytest-cov)
# -------------------------
[tool.coverage.run]
source = ["src"]
omit = [
 "*/tests/*",
    "*/migrations/*",
    "*/alembic/versions/*",
    "src/scripts/*",
    "src/dev.py",
    "src/main.py",
    "src/tasks/*",
    "src/core/admin/*",
    "src/middlewares/*",
    "src/core/celery.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# -------------------------
# PYRIGHT
# -------------------------
[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "**/alembic", "**/tests", "**/scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

# -------------------------
# DEPTRY (unused dependencies)
# -------------------------
[tool.deptry]
per_rule_ignores = { DEP001 = ["pytest", "coverage", "ruff", "mypy", "bandit", "pre-commit", "pyright", "api", "core", "db", "repositories", "services", "schemas", "utils", "middlewares", "scripts", "app", "tasks", "main"], DEP002 = ["pytest", "coverage", "ruff", "mypy", "bandit", "pre-commit", "pyright", "anyio", "bcrypt", "cryptography", "flower", "gunicorn", "orjson", "psycopg", "pydantic-extra-types", "python-dateutil", "python-jose", "pytest-cov", "pytest-mock", "deptry"], DEP003 = ["pytest", "coverage", "ruff", "mypy", "bandit", "pre-commit", "pyright", "starlette", "wtforms", "sentry_sdk", "httpx", "typer"] }
exclude = ["alembic/versions", "tests", "scripts", ".venv", "venv", "__pycache__", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
