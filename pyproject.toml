[project]
name = "fastapibackend"
version = "0.1.0"
description = "Production-ready FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.4",
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cryptography>=46.0.7",
    "fastapi[all]>=0.135.3",
    "flower>=2.0.1",
    "loguru>=0.7.3",
    "orjson>=3.11.8",
    "prometheus-client>=0.24.1",
    "psycopg>=3.3.3",
    "pwdlib[bcrypt]>=0.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt[crypto]>=2.12.1",
    "python-dateutil>=2.9.0.post0",
    "python-jose>=3.5.0",
    "redis>=7.4.0",
    "slowapi>=0.1.9",
    "sqladmin>=0.24.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
    "yarl>=1.23.0",
]

# -------------------------
# DEV DEPENDENCIES
# -------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "bandit>=1.9.4",
    "deptry>=0.25.1",
]

# -------------------------
# PYTEST
# -------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]

# -------------------------
# RUFF (LINT + IMPORTS)
# -------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle
    "I",              # imports (замена isort)
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
]
ignore = [
    "B008",  # FastAPI Depends
    "UP046", # Pydantic generics
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

# -------------------------
# RUFF FORMAT (вместо части black)
# -------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# -------------------------
# BLACK (оставляем как formatter)
# -------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

# -------------------------
# MYPY (минимально безопасный старт)
# -------------------------
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = false

# -------------------------
# BANDIT (security)
# -------------------------
[tool.bandit]
skips = ["B101"]  # assert usage (ok in tests)
exclude_dirs = ["tests"]

# -------------------------
# COVERAGE (pytest-cov)
# -------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
